[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
extend-select = [
    "B",      # bugbear
    "I",      # import sorting
    "UP",     # pyupgrade
    "ASYNC",  # async best practices
]
exclude = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/core/permissions.py" = ["B008"]
"tests/**/*.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
exclude = "(app[\\\\/](services|api|management)[\\\\/]|app/initial_data.py)"

[[tool.mypy.overrides]]
module = ["app.services.*", "app.api.*", "app.management.*"]
ignore_errors = true

[tool.pytest.ini_options]
# Coverage gate enforces baseline across critical modules.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=65"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "app/management/*",
    "app/tasks/*",
    "app/reports/*",
    "app/initial_data.py",
    "app/middleware/*",
]

[tool.coverage.report]
omit = [
    "app/management/*",
    "app/tasks/*",
    "app/reports/*",
    "app/initial_data.py",
    "app/middleware/*",
]
