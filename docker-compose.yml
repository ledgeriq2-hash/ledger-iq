version: "3.9"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.example
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgeriq} -d ${POSTGRES_DB:-ledgeriq}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ledgeriq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ledgeriq

  backend:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; urllib.request.urlopen('http://localhost:8000/health').read(); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pip show gunicorn >/dev/null 2>&1 || pip install --no-cache-dir gunicorn
        exec /app/docker/entrypoint.sh
    networks:
      - ledgeriq

  frontend:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.example
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -d node_modules ]; then
          npm ci
        fi
        npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok) throw new Error('bad')}).then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - ledgeriq

  worker:
    build: *backend-build
    restart: unless-stopped
    profiles: ["workers"]
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app worker -l INFO
    networks:
      - ledgeriq

  beat:
    build: *backend-build
    restart: unless-stopped
    profiles: ["workers"]
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app beat -l INFO
    networks:
      - ledgeriq

  frontend_build:
    build:
      context: ./frontend
      target: builder
    restart: "no"
    profiles: ["static"]
    volumes:
      - frontend_dist:/frontend_dist
    command: ["/bin/sh", "-c", "rm -rf /frontend_dist/* && cp -a /app/dist/. /frontend_dist/"]
    networks:
      - ledgeriq

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["static"]
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend_build:
        condition: service_started
    networks:
      - ledgeriq

volumes:
  pgdata:
  frontend_dist:
  frontend_node_modules:

networks:
  ledgeriq:
    driver: bridge
