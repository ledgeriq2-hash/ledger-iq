version: "3.9"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgeriq}
      POSTGRES_USER: ${POSTGRES_USER:-ledgeriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgeriq_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgeriq} -d ${POSTGRES_DB:-ledgeriq}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ledgeriq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ledgeriq

  backend:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ✅ expose داخل الشبكة
    expose:
      - "8000"
    # ✅ publish على جهازك للاختبار + OpenAPI
    ports:
      - "8000:8000"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        pip show gunicorn >/dev/null 2>&1 || pip install --no-cache-dir gunicorn
        exec /app/docker/entrypoint.sh
    networks:
      - ledgeriq

  worker:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app worker -l INFO
    networks:
      - ledgeriq

  beat:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app beat -l INFO
    networks:
      - ledgeriq

  frontend_build:
    build:
      context: ./frontend
      target: builder
    restart: "no"
    volumes:
      - frontend_dist:/frontend_dist
    command: ["/bin/sh", "-c", "rm -rf /frontend_dist/* && cp -a /app/dist/. /frontend_dist/"]
    networks:
      - ledgeriq

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend_build:
        condition: service_started
    networks:
      - ledgeriq

volumes:
  pgdata:
  frontend_dist:

networks:
  ledgeriq:
    driver: bridge
