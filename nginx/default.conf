map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    sendfile on;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve backend dynamically to avoid stale container IPs after restarts.
    resolver 127.0.0.11 ipv6=off;

    # NOTE:
    # This forwards /api/... to the backend as /api/... (no rewrite).
    # If your backend routes are NOT prefixed with /api, you must add a rewrite rule here.
    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/health$ /health break;
        rewrite ^/api/openapi\.json$ /openapi.json break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
