name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: pytest backend/tests

  lint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend lint deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check app tests
        working-directory: backend

      - name: Mypy
        run: mypy app
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, lint]
    env:
      PUSH_IMAGES: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Frontend build (artifact check)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
        id: node-setup

      - name: Install frontend deps
        if: always()
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundle
        if: always()
        working-directory: frontend
        run: npm run build

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref,'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref,'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build backend image
        run: |
          TAGS=""
          while read -r tag; do TAGS="$TAGS --tag $tag"; done <<< "${{ steps.meta-backend.outputs.tags }}"
          if [[ "$PUSH_IMAGES" == "true" ]]; then
            docker buildx build --platform linux/amd64 $TAGS -f backend/Dockerfile . --push
          else
            docker buildx build --platform linux/amd64 $TAGS -f backend/Dockerfile . --load
          fi

      - name: Build frontend image
        run: |
          TAGS=""
          while read -r tag; do TAGS="$TAGS --tag $tag"; done <<< "${{ steps.meta-frontend.outputs.tags }}"
          if [[ "$PUSH_IMAGES" == "true" ]]; then
            docker buildx build --platform linux/amd64 $TAGS -f frontend/Dockerfile frontend --push
          else
            docker buildx build --platform linux/amd64 $TAGS -f frontend/Dockerfile frontend --load
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, lint]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: sqlite+aiosqlite:///./e2e.db
      FRONTEND_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000/api/v1
      PYTHONPATH: backend
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Prepare database schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python - <<'PY'
          import asyncio
          from app.database import Base, engine
          async def main():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(main())
          PY

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          sleep 5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start frontend preview
        working-directory: frontend
        run: |
          npm run build
          nohup npm run preview -- --host --port 3000 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          sleep 5

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npm run test:e2e

      - name: Teardown services
        if: always()
        run: |
          if [ -f /tmp/frontend.pid ]; then kill $(cat /tmp/frontend.pid) || true; fi
          if [ -f /tmp/backend.pid ]; then kill $(cat /tmp/backend.pid) || true; fi
          sudo lsof -i :3000 || true
          sudo lsof -i :8000 || true

  load-test-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && secrets.K6_TOKEN != ''
    env:
      BASE_URL: ${{ secrets.K6_BASE_URL }}
      TOKEN: ${{ secrets.K6_TOKEN }}
      TENANT_ID: ${{ secrets.K6_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends k6
      - name: Run smoke load test
        env:
          BASE_URL: ${{ env.BASE_URL }}
          TOKEN: ${{ env.TOKEN }}
          TENANT_ID: ${{ env.TENANT_ID }}
        run: |
          export BASE_URL="${BASE_URL:-https://example.com}"
          k6 run load_tests/smoke.js

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
